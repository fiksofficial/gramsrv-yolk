name: Build and publish gramsrv yolk

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build-yolk.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN must be added as repo secrets:
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      # Never put the actual token value in this file or in chat.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gramsrv-yolk:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gramsrv-yolk:${{ github.sha }}
